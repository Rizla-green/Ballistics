<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5a0"/>
      <stop offset="100%" style="stop-color:#00b4ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5a0"/>
      <stop offset="100%" style="stop-color:#00b4ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1f2e" rx="80"/>

  <!-- Bullet -->
  <ellipse cx="148" cy="248" rx="18" ry="28" fill="url(#g1)"/>
  <path d="M148 220 Q190 220 210 248 Q190 276 148 276 Z" fill="url(#g1)"/>
  <!-- Bullet band -->
  <rect x="155" y="236" width="18" height="24" rx="3" fill="#0d1117" opacity="0.4"/>

  <!-- Bar chart (green) -->
  <rect x="225" y="235" width="18" height="40" rx="3" fill="url(#g1)" opacity="0.9"/>
  <rect x="250" y="215" width="18" height="60" rx="3" fill="url(#g1)" opacity="0.9"/>
  <rect x="275" y="195" width="18" height="80" rx="3" fill="url(#g1)" opacity="0.9"/>
  <rect x="300" y="210" width="18" height="65" rx="3" fill="url(#g2)" opacity="0.9"/>

  <!-- Trajectory arc line -->
  <path d="M220 270 Q270 180 350 195" stroke="url(#g2)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Dots on trajectory -->
  <circle cx="220" cy="270" r="6" fill="#00b4ff"/>
  <circle cx="285" cy="205" r="6" fill="#00b4ff"/>
  <circle cx="350" cy="195" r="6" fill="#00b4ff"/>

  <!-- Pulse/heartbeat line -->
  <polyline points="330,248 345,248 355,225 365,268 375,238 385,255 400,255" stroke="#00b4ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: Ballistics -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="url(#g1)">Ballistics</text>
  <!-- Text: Data -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="url(#g2)">Data</text>
</svg>
